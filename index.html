<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>THE KING PHONE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0a1d4d, #0f3c91);
    color: #fff;
}

header {
    text-align: center;
    padding: 40px 20px;
    background: #081a3a;
}

header h1 {
    font-size: 42px;
    color: #f9c74f;
    margin: 0;
}

header p {
    font-size: 18px;
    color: #ddd;
}

.section {
    padding: 40px 20px;
    max-width: 1100px;
    margin: auto;
}

.section h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 28px;
    color: #f9c74f;
}

.services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.service {
    background: rgba(255,255,255,0.1);
    padding: 25px 20px;
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.service:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-5px);
}

.service i {
    font-size: 40px;
    color: #f9c74f;
    margin-bottom: 15px;
}

/* WhatsApp Button */
.whatsapp {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #25D366;
    color: white;
    padding: 15px 20px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 18px;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
}

.modal-content {
    background: #081a3a;
    margin: 10% auto;
    padding: 25px;
    width: 90%;
    max-width: 400px;
    border-radius: 15px;
    text-align: center;
}

.close {
    font-size: 28px;
    cursor: pointer;
    float: right;
    color: #f9c74f;
}

.offers button {
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 16px;
    background: #f9c74f;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.offers button:hover {
    background: #ffd166;
}

footer {
    text-align: center;
    padding: 20px;
    background: #081a3a;
}
</style>
</head>

<body>

<header>
    <h1>THE KING PHONE</h1>
    <p>لخدمات شحن الألعاب والاشتراكات والخدمات المالية</p>
</header>

<section class="section">
<h2>🎮 خدمات الألعاب والاشتراكات</h2>
<div class="services">
    <div class="service" onclick="freefire()"><i class="fas fa-fire"></i><h3>فري فاير</h3></div>
    <div class="service" onclick="pubg()"><i class="fas fa-crosshairs"></i><h3>ببجي</h3></div>
    <div class="service" onclick="netflix()"><i class="fab fa-netflix"></i><h3>نتفلكس</h3></div>
</div>
</section>

<section class="section">
<h2>💳 الخدمات المالية</h2>
<div class="services">
    <div class="service" onclick="mtn()"><i class="fas fa-signal"></i><h3>رصيد MTN</h3></div>
    <div class="service" onclick="syriatel()"><i class="fas fa-sim-card"></i><h3>رصيد Syriatel</h3></div>
</div>
</section>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>
    <h2 id="title"></h2>
    <div id="offers" class="offers"></div>
  </div>
</div>

<a class="whatsapp" href="https://wa.me/963943438959" target="_blank">
<i class="fab fa-whatsapp"></i> واتساب
</a>

<footer>
جميع الحقوق محفوظة © THE KING PHONE
</footer>

<script>
const phone = "963943438959";

function openModal(title, content) {
    document.getElementById("title").innerText = title;
    document.getElementById("offers").innerHTML = content;
    document.getElementById("modal").style.display = "block";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function order(text) {
    const msg = encodeURIComponent("مرحبًا، أريد " + text);
    window.open(`https://wa.me/${phone}?text=${msg}`, "_blank");
}

function freefire() {
openModal("🔥 عروض فري فاير", `
<button onclick="order('375 جوهرة فري فاير - 2 دولار')">375 جوهرة – 2$</button>
<button onclick="order('575 جوهرة فري فاير - 4 دولار')">575 جوهرة – 4$</button>
`);
}

function pubg() {
openModal("🎯 عروض ببجي", `
<button onclick="order('325 شدة ببجي - 5 دولار')">325 شدة – 5$</button>
`);
}

function netflix() {
openModal("🎬 اشتراكات نتفلكس", `
<button onclick="order('اشتراك نتفلكس شهري - 15 دولار')">شهري – 15$</button>
<button onclick="order('اشتراك نتفلكس 3 أشهر - 40 دولار')">3 أشهر – 40$</button>
`);
}

function mtn() {
openModal("📶 رصيد MTN", `
<button onclick="order('24000 رصيد MTN - 3 دولار')">24000 – 3$</button>
`);
}

function syriatel() {
openModal("📱 رصيد Syriatel", `
<button onclick="order('24000 رصيد Syriatel - 3 دولار')">24000 – 3$</button>
`);
}
</script>

</body>
</html>
